# 도메인 분류 키워드 테이블. strong=2점, weak=1점.
# 동점 또는 0점이면 general로 처리 (과잉 분류 방지)
domains:
  banking:
    strong: [예금, 적금, 대출, 계좌, 송금, 이체, 통장, 은행]
    weak: [금리, 한도, 신용점수, 카드, 이자]
  insurance:
    strong: [보험, 보장, 약관, 특약, 면책, 해지환급, 실비, 진단금, 보험료, 보험금]
    weak: [청구, 갱신, 피보험자]
  investment:
    strong: [투자, 펀드, 주식, ETF, 채권, 코인, 종목, 배당]
    weak: [수익률, 매수, 매도, 포트폴리오, 원금]
